[project]
name = "ecovuna-backend"
version = "0.1.0"
description = "Offline-first agentic extension operations API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mcp>=1.0",
  "fastmcp>=2.0",
  "mcp-server-fetch",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "langchain-google-genai>=2.0",
  "google-cloud-firestore>=2.16",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
