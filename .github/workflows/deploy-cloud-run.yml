name: Deploy Ecovuna to Cloud Run

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  API_SERVICE: ecovuna-api
  WEB_SERVICE: ecovuna-web
  DOMAIN: ecovuna.vpasi.app
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        run: |
          echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=sha-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Cloud Run runtime identity
        run: |
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" \
            --format='value(projectNumber)')
          echo "RUNTIME_SERVICE_ACCOUNT=${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" >> "$GITHUB_ENV"

      - name: Build and push API image
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_NAMESPACE }}/ecovuna-api:${{ env.RELEASE_TAG }}
          SHA_IMAGE: ghcr.io/${{ env.IMAGE_NAMESPACE }}/ecovuna-api:sha-${{ github.sha }}
        run: |
          docker build --file backend/Dockerfile --tag "$IMAGE" .
          docker tag "$IMAGE" "$SHA_IMAGE"
          docker push "$IMAGE"
          docker push "$SHA_IMAGE"
          echo "API_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy API
        run: |
          gcloud run deploy "$API_SERVICE" \
            --image "$API_IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --memory 512Mi \
            --min-instances 1 \
            --max-instances 2 \
            --set-env-vars "FRONTEND_ORIGIN=https://${DOMAIN},LLM_PROVIDER=${LLM_PROVIDER:-aws_bedrock},AWS_REGION=${AWS_REGION:-eu-west-1},BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0},AWS_S3_BUCKET=${AWS_S3_BUCKET:-ecovuna-agronomy-kb},STORAGE_BACKEND=dynamodb,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},RELEASE_VERSION=${RELEASE_TAG}"
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          echo_placeholder: "true"
      - name: Resolve API URL
        run: |
          echo "API_URL=$(gcloud run services describe "$API_SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')" >> "$GITHUB_ENV"

      - name: Build and push web image
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_NAMESPACE }}/ecovuna-web:${{ env.RELEASE_TAG }}
          SHA_IMAGE: ghcr.io/${{ env.IMAGE_NAMESPACE }}/ecovuna-web:sha-${{ github.sha }}
        run: |
          docker build --file frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$API_URL" \
            --build-arg NEXT_PUBLIC_RELEASE_VERSION="$RELEASE_TAG" \
            --tag "$IMAGE" frontend
          docker tag "$IMAGE" "$SHA_IMAGE"
          docker push "$IMAGE"
          docker push "$SHA_IMAGE"
          echo "WEB_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy web
        run: |
          gcloud run deploy "$WEB_SERVICE" \
            --image "$WEB_IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --memory 512Mi \
            --min-instances 1 \
            --max-instances 2

      - name: Smoke test API and web services
        run: |
          WEB_URL=$(gcloud run services describe "$WEB_SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format='value(status.url)')
          curl --fail --retry 5 --retry-delay 5 "$API_URL/api/health"
          test "$(curl --fail --retry 5 --retry-delay 5 "$API_URL/api/health" | jq -r .release_version)" = "$RELEASE_TAG"
          curl --fail --retry 5 --retry-delay 5 "$WEB_URL"
          CSS_PATH=$(curl --fail --retry 5 --retry-delay 5 "$WEB_URL" \
            | sed -n 's/.*href="\([^"]*\.css\)".*/\1/p' | head -n 1)
          test -n "$CSS_PATH"
          curl --fail --retry 5 --retry-delay 5 "$WEB_URL$CSS_PATH" >/dev/null
          echo "API: $API_URL"
          echo "Web service: $WEB_URL"
          echo "Custom domain mapping is configured separately for Cloudflare DNS."
