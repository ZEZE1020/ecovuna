name: Auto Release & Deploy on Main

on:
  workflow_run:
    workflows: ["Ecovuna CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional explicit release tag (e.g. v0.3.1); leave empty to auto-increment patch tag"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  tag-and-trigger-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next semantic version tag
        id: next_tag
        run: |
          git fetch --tags --force
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [[ -n "$INPUT_TAG" ]]; then
            NEXT_TAG="$INPUT_TAG"
          else
            LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
            if [[ -z "$LATEST_TAG" ]]; then
              NEXT_TAG="v0.3.0"
            else
              HEAD_TAG=$(git tag --points-at HEAD 'v*' | head -n 1)
              if [[ -n "$HEAD_TAG" ]]; then
                echo "HEAD is already tagged with $HEAD_TAG"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "tag=$HEAD_TAG" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              VERSION=${LATEST_TAG#v}
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              PATCH=$((PATCH + 1))
              NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: steps.next_tag.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.next_tag.outputs.tag }}"
          git tag -a "$TAG" -m "Automated Ecovuna release $TAG"
          git push origin "$TAG"

      - name: Dispatch Cloud Run deployment workflow
        if: steps.next_tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-cloud-run.yml --ref "${{ steps.next_tag.outputs.tag }}" || true
